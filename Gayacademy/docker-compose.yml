services:
  postgres:
    image: postgres:16-alpine
    container_name: gaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gayacademy
      POSTGRES_USER: gaya
      POSTGRES_PASSWORD: gaya_dev_2025
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaya -d gayacademy"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: gaya-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "redis_dev_2025", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_2025", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: gaya-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: gaya
      MONGO_INITDB_ROOT_PASSWORD: mongo_dev_2025
      MONGO_INITDB_DATABASE: gayacademy_chat
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "gaya", "-p", "mongo_dev_2025", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: gaya-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: gaya
      RABBITMQ_DEFAULT_PASS: rabbit_dev_2025
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gaya-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gaya_minio_admin
      MINIO_ROOT_PASSWORD: minio_dev_2025
    ports:
      - "9000:9000"     # API S3
      - "9001:9001"     # Console Web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: gaya-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 gaya_minio_admin minio_dev_2025;
      mc mb --ignore-existing local/gaya-media;
      mc anonymous set download local/gaya-media;
      echo 'Bucket gaya-media pronto';
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  rabbitmq_data:
  minio_data: